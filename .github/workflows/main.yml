name: Divar API Test

on:
  workflow_dispatch:

jobs:
  test-divar-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Test Divar API
        run: python divar_monitor.py
